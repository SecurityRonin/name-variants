[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# `name-variants` is reached by `name-variants-py` as a path dependency with no
# version, because the pyo3 crate is publish = false and is built by maturin
# rather than packaged. That is a wildcard by construction, not an unpinned
# third-party dependency. This permits wildcards ONLY for path deps on private
# crates; a genuine unpinned dependency on a published crate still fails.
allow-wildcard-paths = true
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
