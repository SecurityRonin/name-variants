name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@0e677831e286bec0fce2613f9958f6af72ed4a2c
    with:
      # MSRV is NOT overridden: both members now declare 1.80 and the shared
      # workflow verifies each at its own floor. The job this replaces asserted
      # 1.85, a number nothing had ever checked.
      #
      # Coverage is a FLOOR at 80, from a measured LINE figure of 80.85% read via
      # `cargo llvm-cov --json`. There was no coverage gate here before. The
      # ignore-regex drops `generated.rs`, which is codegen'd phf tables emitted
      # from the Python catalog -- exercising every arm of a generated lookup
      # table measures the generator, not this crate.
      coverage-gate: floor
      coverage-floor: 80
      coverage-ignore-regex: '(^|/)src/(main\.rs|bin/)|generated\.rs'
      # ubuntu-only: the Rust slice is a library, and the cross-platform surface
      # that matters here (the PyO3 wheel, the WASM build) is covered by
      # native.yml and wasm.yml, which already run their own matrices.
      os-matrix: false
