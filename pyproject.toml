[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "name-variants"
version = "0.1.0"
description = "Multilingual name romanization lookup tables: Chinese, Japanese, Korean, Arabic, Vietnamese, Indian, Persian, Hebrew, Thai, Greek, Turkish, Russian, Indonesian/Malay"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "SecurityRonin" }]
keywords = [
    "names", "romanization", "transliteration", "cjk", "arabic",
    "multilingual", "nlp", "ner", "pseudonymization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["click>=8.0"]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
nv = "name_variants.cli:cli"

[project.urls]
Homepage = "https://github.com/SecurityRonin/name-variants"
Repository = "https://github.com/SecurityRonin/name-variants"
Issues = "https://github.com/SecurityRonin/name-variants/issues"

[tool.hatch.build.targets.wheel]
packages = ["name_variants"]

[tool.hatch.build.targets.sdist]
include = ["name_variants/", "tests/", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "scripts", "codegen"]
skips = []

[tool.maturin]
# Build the optional native extension; does not replace hatchling for pure-Python builds.
# Usage: maturin build --manifest-path name-variants-py/Cargo.toml
#        then pip install the resulting wheel, or:
#        maturin develop --manifest-path name-variants-py/Cargo.toml
module-name = "name_variants._native"
python-source = "."
manifest-path = "name-variants-py/Cargo.toml"
